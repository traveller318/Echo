# SOURCE OF TRUTH KEYWORDS: Cargo.toml, crate manifest, clippy deny lints, release profile, pinned crates, echo_lib
# WHAT:  Manifest of the single Echo crate: the `echo_lib` library (all layers) plus the `echo` binary (main.rs).
# WHY:   One crate with layer folders keeps paths identical to the rulebook; tests/architecture.rs enforces the
#        import matrix (02 §3.2, 05 decision log). Every dependency is pinned with `=` so builds are reproducible
#        (05 W21). Lints are deny-level here, not in source attributes, so no file can quietly relax them;
#        clippy.toml allows unwrap/expect/panic inside tests only. clippy::exit is not enabled: the code that
#        tauri::generate_context! expands to calls process::exit, and a lint is never silenced with #[allow].
# WHERE: Built by `pnpm tauri dev|build` and the cargo steps of the local gate (02 §11).
[package]
name = "echo"
version = "0.1.0"
description = "Local, private speech-to-text for Windows and Linux."
license = "MIT"
edition = "2024"
rust-version = "1.98"
publish = false

[lib]
name = "echo_lib"
# Desktop only (Windows, Linux): no mobile targets, so no staticlib/cdylib.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
# Clipboard text (05 W4); `image-data` is off: Echo only ever writes text, and it would pull an image codec.
arboard = { version = "=3.6.1", default-features = false }
cpal = "=0.18.2"
garde = { version = "=0.23.0", default-features = false, features = ["derive"] }
hound = "=3.5.1"
# The `ort` transcribe-rs 0.3.11 pinned when it was evaluated (05 A17); Parakeet now runs on it directly (05 A10).
# ONNX Runtime API 24 = ONNX Runtime 1.24.x; `load-dynamic` links nothing and downloads nothing: the bundled DLL is loaded by absolute path (05 A5).
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["api-24", "load-dynamic", "std"] }
parking_lot = "=0.12.5"
# The one HTTP client (adapters/net, 02 §10): rustls with no bundled provider, so the `ring` provider below is the only
# crypto (aws-lc-rs needs cmake + NASM, 05 W24); certificates are checked by Windows (rustls-platform-verifier).
# `system-proxy` honours the Windows proxy settings; no HTTP/2, cookies or decompression are needed for file downloads.
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
rtrb = "=0.4.0"
rubato = "=5.0.0"
# `bundled` compiles SQLite (with FTS5) through MSVC, no system SQLite; `backup` is the online backup API used for the
# pre-migration copy; `cache` gives prepared-statement caching. Default features pull a wasm backend, so they are off.
rusqlite = { version = "=0.40.2", default-features = false, features = ["backup", "bundled", "cache"] }
rusqlite_migration = "=2.6.0"
# Installed as the process-wide rustls provider before the HTTP client is built (reqwest panics without one, 05 W41).
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
# SHA-256 of every model file while it downloads, copies or is verified (02 §8.2); SHA-NI is used when the CPU has it.
sha2 = "=0.10.9"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
# `tray-icon`: the notification-area icon and its menu (app/tray.rs).
tauri = { version = "=2.11.6", features = ["tray-icon"] }
# The folder picker behind "Import from folder"; wired only in app/plugins.rs, used only by its adapter.
tauri-plugin-dialog = "=2.7.3"
# WinRT toasts; wired only in app/plugins.rs, used only by its adapter.
tauri-plugin-notification = "=2.4.0"
# A second launch hands its arguments to the running Echo and exits (05 W20); wired only in app/plugins.rs.
tauri-plugin-single-instance = "=2.4.5"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
thiserror = "=2.0.20"
# Tauri's runtime (same version it links); `time` gives async waits, `rt` lets tests build a runtime, `sync` gives
# the session actor its inbox (mpsc) and its query replies (oneshot).
tokio = { version = "=1.53.1", default-features = false, features = ["rt", "sync", "time"] }
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
tracing-appender = "=0.2.5"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "json", "std"] }
ulid = { version = "=3.0.0", features = ["serde"] }
# Reads the pinned llama.cpp release archive (a zip of Deflate entries) into `runtimes/` (02 §8.2). Only the Deflate codec,
# through flate2 on the pure-Rust zlib-rs backend (no C build, 05 W24); every other codec and encryption is off.
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Win32 bindings: every Windows adapter and nothing else (adapters/platform.rs picks the Linux ones elsewhere).
[target.'cfg(windows)'.dependencies]
# Same version tauri already links, so no second copy is compiled; features grow with each Win32 adapter.
windows = { version = "=0.61.3", features = [
    "Win32_Devices_Properties",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
# The crate `windows` re-exports; named directly only because the COM `#[implement]` macro (the audio device watch's
# IMMNotificationClient) expands to `::windows_core` paths. Same version `windows` already links.
windows-core = "=0.61.2"

# Linux adapters (adapters/linux and the `linux*.rs` file of each adapter folder). The Wayland input paths go through
# xdg-desktop-portal (ashpd: GlobalShortcuts, RemoteDesktop, Settings) and libei (reis), so Echo needs no root and
# no access to /dev/input by default; X11 uses XInput2 raw events and XTest (x11rb, the version tao already links).
[target.'cfg(target_os = "linux")'.dependencies]
# Wayland's data-control protocol where the compositor offers it; otherwise arboard uses X11 (XWayland).
arboard = { version = "=3.6.1", default-features = false, features = ["wayland-data-control"] }
# zbus runs on async-io, never tokio: the notification plugin (notify-rust) blocks on zbus from Tokio workers, which a
# tokio-backed zbus turns into "cannot start a runtime from within a runtime".
ashpd = { version = "=0.13.13", default-features = false, features = ["async-io", "global_shortcuts", "remote_desktop", "screencast", "settings"] }
# The PulseAudio native protocol in pure Rust (no libpulse); PipeWire's pulse server speaks it too.
cpal = { version = "=0.18.2", features = ["pulseaudio"] }
# StreamExt over the portal and D-Bus signal streams; the version zbus already links.
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
# Unpacks the Linux llama.cpp release (a tar.gz of symlink chains); flate2 on the same pure-Rust backend as zip.
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib-rs"] }
libc = "=0.2.189"
# `select!` for the D-Bus and portal watch loops (adapters/power, adapters/hotkey on Wayland).
tokio = { version = "=1.53.1", default-features = false, features = ["macros"] }
reis = { version = "=0.7.1", features = ["tokio"] }
tar = { version = "=0.4.46", default-features = false }
# The wlroots virtual-keyboard protocol (Hyprland, Sway, river...): Echo's paste on compositors without a RemoteDesktop portal.
wayland-client = "=0.31.15"
wayland-protocols-misc = { version = "=0.3.12", default-features = false, features = ["client"] }
x11rb = { version = "=0.13.2", features = ["xinput", "xtest", "randr"] }
# Same version tauri's notification plugin links; logind sleep/unlock signals (adapters/power/linux.rs).
zbus = { version = "=5.19.0", default-features = false, features = ["async-io"] }

[dev-dependencies]
# `test` adds the mock runtime used to call commands end to end (dev builds only; resolver 3 keeps it out of the app).
tauri = { version = "=2.11.6", features = ["test"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
mem_forget = "deny"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
