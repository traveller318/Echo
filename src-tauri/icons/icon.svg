<!--
  SOURCE OF TRUTH KEYWORDS: app icon source, icon.svg, tauri icon, waveform mark, installer icon
  WHAT:  Vector source for every generated app icon (ico/png) in this folder.
  WHY:   Regenerate with `pnpm tauri icon src-tauri/icons/icon.svg`; colours are the accent values from docs/04 §3.1.
         The final icon and name check is an open item for P5 (docs/05 §6).
  WHERE: Input to the Tauri icon generator; outputs are listed in tauri.conf.json `bundle.icon`.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A84FF"/>
      <stop offset="1" stop-color="#007AFF"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <g fill="#FFFFFF">
    <rect x="236" y="432" width="72" height="160" rx="36"/>
    <rect x="356" y="336" width="72" height="352" rx="36"/>
    <rect x="476" y="256" width="72" height="512" rx="36"/>
    <rect x="596" y="336" width="72" height="352" rx="36"/>
    <rect x="716" y="432" width="72" height="160" rx="36"/>
  </g>
</svg>
